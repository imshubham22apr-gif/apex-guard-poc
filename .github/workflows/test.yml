name: APEX-Guard Oracle & Environment Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Deterministic Oracle & Scenario Soundness
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Oracle Unit Tests
        run: |
          python -m pytest -v tests/test_verifier.py

      - name: Run Deterministic Mock Benchmark Evaluation
        run: |
          python agent_eval.py --mock
